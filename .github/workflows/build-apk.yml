name: Build Android APK Studio

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Verify Android source files
        run: |
          set -euo pipefail
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/css/style.css
          test -s app/src/main/assets/js/template-import.js
          node --check app/src/main/assets/js/template-import.js
          python -m json.tool app/src/main/assets/config/app-config.json > /dev/null
          grep -q 'SAMPLE' app/src/main/assets/index.html
          grep -q 'NativeTemplate' app/src/main/java/com/visastudio/app/MainActivity.kt
          grep -q 'printDocument' app/src/main/java/com/visastudio/app/MainActivity.kt
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace --warning-mode all 2>&1 | tee build-diagnostics.log
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Document-Studio-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Document-Studio-Build-Diagnostics
          path: build-diagnostics.log
          if-no-files-found: warn
